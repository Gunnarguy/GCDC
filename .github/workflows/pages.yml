name: Deploy GitHub Pages Atlas

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Source to Docs and Cache-Bust
        run: |
          # Copy all source files to docs to keep them perfectly synced
          cp -R src/grandchase_meta_analyzer docs/
          
          # Add a blank favicon to prevent 404s
          touch docs/favicon.ico
          
          # Cache bust Stlite file URLs using the git commit SHA (only replacing within "url": "..." values)
          sed -i 's/"url": "\([^"]*\.py\)"/"url": "\1?v='${GITHUB_SHA}'"/g' docs/index.html
          sed -i 's/"url": "\([^"]*\.db\)"/"url": "\1?v='${GITHUB_SHA}'"/g' docs/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4