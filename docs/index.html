<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GrandChase Atlas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.75.0/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.75.0/build/stlite.js"></script>
    <script>
      stlite.mount(
        {
          requirements: ["altair<5.3.0", "pandas", "streamlit", "sqlite3"],
          entrypoint: "app.py",
          files: {
            "grandchase.db": {
                        "url": "./grandchase.db"
            },
            "app.py": "import sys\\nimport typing_extensions\\n\\n# Patch missing TypeAliasType in typing_extensions for Altair compatibility in Stlite\\nif not hasattr(typing_extensions, 'TypeAliasType'):\\n    class TypeAliasType:\\n        def __init__(self, name, value, type_params=()):\\n            self.__name__ = name\\n            self.__value__ = value\\n            self.__type_params__ = type_params\\n        def __repr__(self):\\n            return f'TypeAliasType({self.__name__}, {self.__value__})'\\n    typing_extensions.TypeAliasType = TypeAliasType\\n\\n# Patch missing TypeIs in typing_extensions for Altair compatibility in Stlite\\nif not hasattr(typing_extensions, 'TypeIs'):\\n    if hasattr(typing_extensions, 'TypeGuard'):\\n        typing_extensions.TypeIs = typing_extensions.TypeGuard\\n    else:\\n        class _TypeIsMeta(type):\\n            def __getitem__(cls, item):\\n                return bool\\n        class TypeIs(metaclass=_TypeIsMeta):\\n            pass\\n        typing_extensions.TypeIs = TypeIs\\n\\nimport streamlit as st\\nimport grandchase_meta_analyzer.explorer_app as app\\nfrom pathlib import Path\\napp.DB_PATH = Path('grandchase.db')\\napp.main()",
            "grandchase_meta_analyzer/paths.py": {
                        "url": "./grandchase_meta_analyzer/paths.py"
            },
            "grandchase_meta_analyzer/team_analysis.py": {
                        "url": "./grandchase_meta_analyzer/team_analysis.py"
            },
            "grandchase_meta_analyzer/normalize.py": {
                        "url": "./grandchase_meta_analyzer/normalize.py"
            },
            "grandchase_meta_analyzer/__init__.py": {
                        "url": "./grandchase_meta_analyzer/__init__.py"
            },
            "grandchase_meta_analyzer/llm.py": {
                        "url": "./grandchase_meta_analyzer/llm.py"
            },
            "grandchase_meta_analyzer/explorer.py": {
                        "url": "./grandchase_meta_analyzer/explorer.py"
            },
            "grandchase_meta_analyzer/ingest_spreadsheet.py": {
                        "url": "./grandchase_meta_analyzer/ingest_spreadsheet.py"
            },
            "grandchase_meta_analyzer/pages.py": {
                        "url": "./grandchase_meta_analyzer/pages.py"
            },
            "grandchase_meta_analyzer/cli.py": {
                        "url": "./grandchase_meta_analyzer/cli.py"
            },
            "grandchase_meta_analyzer/pipeline.py": {
                        "url": "./grandchase_meta_analyzer/pipeline.py"
            },
            "grandchase_meta_analyzer/explorer_skill_details.py": {
                        "url": "./grandchase_meta_analyzer/explorer_skill_details.py"
            },
            "grandchase_meta_analyzer/storage.py": {
                        "url": "./grandchase_meta_analyzer/storage.py"
            },
            "grandchase_meta_analyzer/settings.py": {
                        "url": "./grandchase_meta_analyzer/settings.py"
            },
            "grandchase_meta_analyzer/explorer_app.py": {
                        "url": "./grandchase_meta_analyzer/explorer_app.py"
            },
            "grandchase_meta_analyzer/scrapers/strategywiki.py": {
                        "url": "./grandchase_meta_analyzer/scrapers/strategywiki.py"
            },
            "grandchase_meta_analyzer/scrapers/fandom.py": {
                        "url": "./grandchase_meta_analyzer/scrapers/fandom.py"
            },
            "grandchase_meta_analyzer/scrapers/__init__.py": {
                        "url": "./grandchase_meta_analyzer/scrapers/__init__.py"
            },
            "grandchase_meta_analyzer/scrapers/common.py": {
                        "url": "./grandchase_meta_analyzer/scrapers/common.py"
            },
            "grandchase_meta_analyzer/scrapers/namuwiki.py": {
                        "url": "./grandchase_meta_analyzer/scrapers/namuwiki.py"
            }
}
        },
        document.getElementById("root"),
      )
    </script>
  </body>
</html>
