import typing_extensions

# Patch missing TypeAliasType in typing_extensions for Altair compatibility in Stlite
if not hasattr(typing_extensions, "TypeAliasType"):
    class TypeAliasType:
        def __init__(self, name, value, type_params=()):
            self.__name__ = name
            self.__value__ = value
            self.__type_params__ = type_params
        def __repr__(self):
            return f"TypeAliasType({self.__name__}, {self.__value__})"
    typing_extensions.TypeAliasType = TypeAliasType

if not hasattr(typing_extensions, "TypeIs"):
    if hasattr(typing_extensions, "TypeGuard"):
        typing_extensions.TypeIs = typing_extensions.TypeGuard
    else:
        class _TypeIsMeta(type):
            def __getitem__(cls, item):
                return bool
        class TypeIs(metaclass=_TypeIsMeta):
            pass
        typing_extensions.TypeIs = TypeIs

import grandchase_meta_analyzer.explorer_app as app
from pathlib import Path
app.DB_PATH = Path('grandchase.db')
